name: Convert MD to Word

on:
  push:
    paths:
      - '**.md'

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Pandoc
        run: sudo apt-get install pandoc -y

      - name: Convert all Markdown files to Word
        run: |
          mkdir -p docs
          find . -name '*.md' -not -path './docs/*' | while read file; do
            filename=$(basename "$file")
            pandoc "$file" -o "docs/${filename%.md}.docx"
          done

      - name: Commit and push generated Word files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/*.docx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate Word docs"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
